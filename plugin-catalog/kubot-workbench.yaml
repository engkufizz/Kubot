description: The Kubot desktop app in your browser. `kubot workbench` serves the desktop interface through the Kubot dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `kubot workbench` run and again after each Kubot update it runs `npm install --ignore-scripts` (guided by Kubot's lockfile) and Vite against your Kubot checkout's desktop sources, writing only under ~/.kubot/kubot-workbench and its own plugin dir (the checkout is only read), and starts `kubot dashboard` on loopback when none is running.
maintainer: sxuff
