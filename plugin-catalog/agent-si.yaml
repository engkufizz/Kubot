description: "Anti-hallucination memory for Kubot: your agent stops inventing answers and answers from facts it can quote from you. One search over your past Kubot, Claude Code, Codex and Grok sessions, both sides shown when sources disagree, never a guess. No LLM, no key, no network, no dependencies. Disclosure — copies the messages of your past Claude Code (~/.claude/projects), Codex (~/.codex/sessions), Grok (~/.grok/sessions) and Kubot (state.db, plus any extra profiles named in brain.toml) sessions, word for word, into a local sessions.sqlite3 beside the brain for search; on by default (index_sessions), local only, no network."
maintainer: joelbrilliant
tier: community
category: memory
requires_kubot: ">=0.22.0"
