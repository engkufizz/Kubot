[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubot"
version = "0.1.0"
description = "Kubot: 100% Pure-Python Agentic CLI & Dashboard Harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kubot Team" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "openai>=1.50.0",
  "certifi>=2024.0.0",
  "truststore>=0.9.0",
  "python-dotenv>=1.0.0",
  "fire>=0.5.0",
  "httpx[socks]>=0.27.0",
  "rich>=13.0.0",
  "tomli-w>=1.0.0",
  "ruamel.yaml>=0.17.0",
  "requests>=2.31.0",
  "jinja2>=3.1.2",
  "pydantic>=2.7.0",
  "prompt_toolkit>=3.0.38",
  "croniter>=2.0.0",
  "snowballstemmer>=2.2.0",
  "packaging>=23.0",
  "Markdown>=3.5.0",
  "PyJWT[crypto]>=2.8.0",
  "cryptography>=42.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "psutil>=5.9.0",
  "websockets>=12.0",
  "pathspec>=0.11.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "httptools>=0.6.0",
  "watchfiles>=0.20.0",
  "python-multipart>=0.0.6",
  "ptyprocess>=0.7.0; sys_platform != 'win32'",
  "pywinpty>=2.0.0; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0.0",
]
anthropic = [
  "anthropic>=0.30.0",
]

[project.scripts]
kubot = "kubot_cli.main:main"
